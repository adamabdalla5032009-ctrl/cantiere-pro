<!-- Supabase > Authentication > Emails > Templates > "Confirm signup"
     Oggetto: Conferma il tuo account Cantierometro -->
<div style="background:#f1f5f9;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px;color:#1e293b;">
    <h1 style="font-size:22px;margin:0 0 6px;color:#0f172a;">Cantiero<span style="color:#ea580c;">metro</span></h1>
    <p style="font-size:16px;line-height:1.5;margin:18px 0 8px;">Ciao,</p>
    <p style="font-size:16px;line-height:1.5;margin:0 0 20px;">
      grazie per esserti registrato a Cantierometro. Conferma il tuo indirizzo email per attivare l'account:
    </p>
    <p style="text-align:center;margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}"
         style="display:inline-block;background:#ea580c;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:8px;">
        Conferma il mio account
      </a>
    </p>
    <p style="font-size:14px;line-height:1.5;color:#64748b;margin:0 0 8px;">
      Se il pulsante non funziona, copia questo indirizzo nel browser:<br>
      <span style="word-break:break-all;">{{ .ConfirmationURL }}</span>
    </p>
    <p style="font-size:14px;line-height:1.5;color:#64748b;margin:16px 0 0;">
      Se non hai creato tu questo account, ignora questa email.
    </p>
  </div>
</div>
